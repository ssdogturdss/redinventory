openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: stores
    description: Store location management
  - name: chemicals
    description: Chemical product management
  - name: inventory
    description: Inventory count management
  - name: reports
    description: AI-powered report generation
  - name: agent-config
    description: Agent configuration management
  - name: voice
    description: Voice STT/TTS operations
  - name: openai
    description: OpenAI AI chat, image, and audio operations
  - name: employees
    description: Employee account management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: JWT token and employee info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/me:
    get:
      operationId: getCurrentEmployee
      tags: [auth]
      summary: Get the currently authenticated employee
      responses:
        "200":
          description: Current employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeWithStore"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out (clears server-side state if any)
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  # Employees
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List all employees (admin only)
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeWithStore"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create a new employee (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeWithStore"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee by ID (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeWithStore"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeWithStore"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # Stores
  /stores:
    get:
      operationId: listStores
      tags: [stores]
      summary: List all stores
      responses:
        "200":
          description: List of stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
    post:
      operationId: createStore
      tags: [stores]
      summary: Create a new store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
      responses:
        "201":
          description: Created store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"

  /stores/{id}:
    get:
      operationId: getStore
      tags: [stores]
      summary: Get a store by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Store details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateStore
      tags: [stores]
      summary: Update a store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUpdate"
      responses:
        "200":
          description: Updated store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteStore
      tags: [stores]
      summary: Delete a store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # Chemicals
  /chemicals:
    get:
      operationId: listChemicals
      tags: [chemicals]
      summary: List all chemicals
      responses:
        "200":
          description: List of chemicals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chemical"
    post:
      operationId: createChemical
      tags: [chemicals]
      summary: Create a new chemical
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChemicalInput"
      responses:
        "201":
          description: Created chemical
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chemical"

  /chemicals/{id}:
    get:
      operationId: getChemical
      tags: [chemicals]
      summary: Get a chemical by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chemical details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chemical"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateChemical
      tags: [chemicals]
      summary: Update a chemical
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChemicalUpdate"
      responses:
        "200":
          description: Updated chemical
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chemical"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteChemical
      tags: [chemicals]
      summary: Delete a chemical
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # Inventory
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List all inventory counts with store and chemical info
      responses:
        "200":
          description: Full inventory list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryEntry"

  /inventory/{storeId}:
    get:
      operationId: getStoreInventory
      tags: [inventory]
      summary: Get inventory counts for a specific store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Inventory for the store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryEntry"

  /inventory/{storeId}/{chemicalId}:
    put:
      operationId: upsertInventoryCount
      tags: [inventory]
      summary: Set (create or update) inventory count for a store+chemical
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
        - name: chemicalId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryCountInput"
      responses:
        "200":
          description: Updated inventory entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryEntry"
    delete:
      operationId: deleteInventoryCount
      tags: [inventory]
      summary: Remove inventory count for a store+chemical pair
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
        - name: chemicalId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Dashboard summary
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [inventory]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # Reports
  /reports/generate:
    post:
      operationId: generateReport
      tags: [reports]
      summary: Generate a report using the AI agent (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "200":
          description: SSE stream of report content and any actions taken
          content:
            text/event-stream: {}

  # Agent Config
  /agent-config:
    get:
      operationId: getAgentConfig
      tags: [agent-config]
      summary: Get the active agent configuration
      responses:
        "200":
          description: Agent configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"
    put:
      operationId: updateAgentConfig
      tags: [agent-config]
      summary: Update the agent configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentConfigUpdate"
      responses:
        "200":
          description: Updated agent configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"

  /agent-config/reset:
    post:
      operationId: resetAgentConfig
      tags: [agent-config]
      summary: Reset agent configuration to factory defaults
      responses:
        "200":
          description: Reset agent configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"

  # Voice
  /voice/transcribe:
    post:
      operationId: transcribeAudio
      tags: [voice]
      summary: Transcribe audio to text (STT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeInput"
      responses:
        "200":
          description: Transcription result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResult"

  /voice/speak:
    post:
      operationId: textToSpeech
      tags: [voice]
      summary: Convert text to speech audio (TTS) — returns SSE stream of base64 audio chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakInput"
      responses:
        "200":
          description: SSE stream of base64 audio chunks
          content:
            text/event-stream: {}

  # OpenAI conversations
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

components:
  schemas:
    # Auth
    LoginInput:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    EmployeeWithStore:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
        storeId:
          type: ["integer", "null"]
        storeName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, username, role, createdAt, updatedAt]

    AuthResult:
      type: object
      properties:
        token:
          type: string
        employee:
          $ref: "#/components/schemas/EmployeeWithStore"
      required: [token, employee]

    # Employees
    EmployeeInput:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, employee]
        storeId:
          type: ["integer", "null"]
      required: [username, password, role]

    EmployeeUpdate:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, employee]
        storeId:
          type: ["integer", "null"]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # Stores
    Store:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
        - updatedAt

    StoreInput:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        notes:
          type: string
      required:
        - name

    StoreUpdate:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        notes:
          type: string

    # Chemicals
    Chemical:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: ["string", "null"]
        unit:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - unit
        - createdAt
        - updatedAt

    ChemicalInput:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        unit:
          type: string
        notes:
          type: string
      required:
        - name
        - unit

    ChemicalUpdate:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        unit:
          type: string
        notes:
          type: string

    # Inventory
    InventoryEntry:
      type: object
      properties:
        storeId:
          type: integer
        chemicalId:
          type: integer
        quantity:
          type: number
        storeName:
          type: string
        chemicalName:
          type: string
        unit:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - storeId
        - chemicalId
        - quantity
        - storeName
        - chemicalName
        - unit
        - updatedAt

    InventoryCountInput:
      type: object
      properties:
        quantity:
          type: number
      required:
        - quantity

    DashboardSummary:
      type: object
      properties:
        totalStores:
          type: integer
        totalChemicals:
          type: integer
        totalInventoryEntries:
          type: integer
        lowStockCount:
          type: integer
        topChemicalsByStore:
          type: array
          items:
            type: object
            properties:
              chemicalName:
                type: string
              totalQuantity:
                type: number
              storeCount:
                type: integer
            required:
              - chemicalName
              - totalQuantity
              - storeCount
      required:
        - totalStores
        - totalChemicals
        - totalInventoryEntries
        - lowStockCount
        - topChemicalsByStore

    # Reports
    ReportRequest:
      type: object
      properties:
        prompt:
          type: string
      required:
        - prompt

    # Agent Config
    AgentConfig:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        systemPrompt:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - systemPrompt
        - updatedAt

    AgentConfigUpdate:
      type: object
      properties:
        name:
          type: string
        systemPrompt:
          type: string

    # Voice
    TranscribeInput:
      type: object
      properties:
        audio:
          type: string
          description: Base64-encoded audio data
      required:
        - audio

    TranscribeResult:
      type: object
      properties:
        text:
          type: string
      required:
        - text

    SpeakInput:
      type: object
      properties:
        text:
          type: string
        voice:
          type: string
          description: Voice ID (e.g. alloy, echo, nova, shimmer)
      required:
        - text

    # OpenAI
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
